insmod vbe
insmod vga

menuentry "graphics" {
    multiboot /boot/kernel.bin
    module /boot/ramdisk.fat
    module /boot/ramdisk2.fat
    set gfxpayload=1280x1024x32
}

menuentry "text" {
    multiboot /boot/kernel.bin
    module /boot/ramdisk.fat
    module /boot/ramdisk2.fat
    set gfxpayload=text
}
